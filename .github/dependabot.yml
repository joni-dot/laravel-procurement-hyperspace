version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  # The production image's base images and the reference setup's images are pinned to exact versions
  # (digests); this keeps them up to date with security fixes.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/postgres"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/.github/backup-drill"
      - "/.github/image-smoke-test"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      docker-compose:
        patterns:
          - "*"
  # The app's PHP and JavaScript packages. Minor and patch updates come as one pull request per
  # ecosystem, major ones each on their own. Security fixes are proposed at once, without the cooldown.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      composer:
        update-types:
          - "minor"
          - "patch"
  # pnpm (pnpm-lock.yaml) is covered by the npm ecosystem.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"
