; Production settings on top of PHP's php.ini-production.

expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Documents may be 20 MB (certificates 10 MB, supplier imports 5 MB). A little room for the form around
; the file, and no more, so nobody can send the server much bigger requests.
upload_max_filesize = 21M
post_max_size = 22M

; Errors go to the container's output, never to the page.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; The code never changes inside a running container, so PHP never needs to check the files again.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600
