# Who may sign in, and how.
# TYPE  DATABASE     USER      ADDRESS  METHOD

# The superuser signs in only from inside the database's own containers, through the socket, as the
# operating system user "postgres" (backups, restores, health check). It has no usable password and
# can't sign in over the network, so a leaked app password can never become superuser access.
local   all          postgres           peer
host    all          postgres  all      reject
host    replication  all       all      reject

# The owner (migrations) and the app's restricted user sign in with their passwords.
local   all          all                scram-sha-256
host    all          all       all      scram-sha-256
