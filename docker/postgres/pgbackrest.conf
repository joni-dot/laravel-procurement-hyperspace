# pgBackRest settings that never change. Bucket, keys, encryption passphrase and retention come from
# the environment (the PGBACKREST_REPO1_* variables that compose.production.yaml fills from .env).
[global]
repo1-type=s3
# Everything is encrypted before it leaves the server; the passphrase is PGBACKREST_REPO1_CIPHER_PASS.
repo1-cipher-type=aes-256-cbc
# Keep full backups (and the changes between them) for PGBACKREST_REPO1_RETENTION_FULL days.
repo1-retention-full-type=time
# Small files are bundled and changed files are stored block by block: fewer, smaller uploads.
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
# Changes are uploaded by a helper process, several files at a time, so a burst of writes doesn't
# queue up behind slow uploads. A change file still counts as saved only once it is in the bucket.
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
# Each backup also keeps the change files it needs to be consistent, so it can be restored on its own,
# even if the change files around it are lost.
archive-copy=y
# Starts a backup right away instead of waiting for the next regular checkpoint.
start-fast=y
log-level-console=info
log-level-file=off

# Change files are shipped every minute; log only their problems.
[global:archive-push]
log-level-console=warn

[global:archive-get]
log-level-console=warn

[hyperspace]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
