# PostgreSQL settings for a small server (2 to 4 CPU cores, 4 GB memory shared with the app).
# On a bigger server, raise shared_buffers to about a quarter of the memory and
# effective_cache_size to about half; see docs/backups.md.

listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'
max_connections = 100
superuser_reserved_connections = 3

# Memory
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 256MB
# Short app queries gain nothing from compiling plans, and the compiling itself costs time.
jit = off

# Disk (assumes an SSD)
random_page_cost = 1.1
effective_io_concurrency = 200

# Write-ahead log: every change is written here first; these files are what the continuous backup ships.
wal_level = replica
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Continuous backup. Each finished change file goes to the backup bucket at once. On a quiet database
# a file can take a long time to fill, so archive_timeout closes it after 60 seconds: at most about a
# minute of changes is ever only on this server.
archive_mode = on
archive_command = 'pgbackrest --stanza=hyperspace archive-push %p'
archive_timeout = 60

# Time
timezone = 'UTC'
log_timezone = 'UTC'

# Sessions that forget an open transaction would block clean-up and table changes.
idle_in_transaction_session_timeout = '10min'

# Logs go to the container's output. Statement parameters and error details can contain personal
# data (names, email addresses), so they are never written: slow statements are logged with their
# $1, $2 placeholders only, failing statements not at all, and errors in their short form.
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 2s
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_error_statement = panic
log_error_verbosity = terse
log_statement = 'none'
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 10s
log_checkpoints = on
